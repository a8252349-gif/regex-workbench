services:
  - type: web
    name: regex-workbench
    runtime: static
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://regex-workbench.onrender.com
      - key: NEXT_PUBLIC_ADSENSE_CLIENT
        value: ca-pub-9328837907414732
      - key: NEXT_PUBLIC_ADSENSE_SCRIPT_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_ADSENSE_MANUAL_ADS_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_SHOW_AD_PLACEHOLDERS
        value: "false"
      - key: NEXT_PUBLIC_GOOGLE_CMP_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_BUILD_VERSION
        generateValue: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /ads.txt
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=900, must-revalidate
      - path: /sitemap.xml
        name: Cache-Control
        value: public, max-age=900, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://www.google.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com https://*.googlesyndication.com; connect-src 'self' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://fundingchoicesmessages.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'
